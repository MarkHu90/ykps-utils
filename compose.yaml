services:
  ykps-utils:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
    image: ykps-utils:local
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3030
    ports:
      # 只绑定回环地址，由 Nginx/Caddy 等反向代理对外提供 HTTPS；
      # Docker 发布的端口会绕过 UFW 防火墙，不要绑定 0.0.0.0 暴露公网。
      - "127.0.0.1:${PORT:-3030}:3030"
    # 可选的邮件模板与通知配置目录：宿主机 config/ 下的文件会以只读
    # 方式出现在容器 /app/config/ 中；目录不存在时 Docker 会自动创建
    # 空目录，不使用模板/通知功能时留空即可。
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
